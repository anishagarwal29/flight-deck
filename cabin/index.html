<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e16">
<title>Flight Deck · First Class</title>
<link rel="stylesheet" href="cabin.css">
<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js", "three/addons/": "./lib/addons/" } }
</script>
<script src="../lib/d3-array.min.js"></script>
<script src="../lib/d3-geo.min.js"></script>
<script src="../lib/topojson-client.min.js"></script>
</head>
<body>
<canvas id="gl"></canvas>

<!-- boarding screen -->
<section id="board">
  <div class="b-inner">
    <div class="b-brand">FLIGHT DECK</div>
    <div class="b-class">FIRST</div>
    <div class="b-route" id="bRoute">Your suite is ready</div>
    <div class="b-sub" id="bSub">Seat 1A · Window</div>
    <button id="boardBtn" class="b-btn"><span>Board</span></button>
    <div class="b-load" id="bLoad">Preparing cabin</div>
  </div>
</section>

<!-- top bar -->
<header id="hud">
  <a class="h-back" href="../" title="Back to the classic app">Classic</a>
  <div class="h-mid">
    <div class="h-route" id="hRoute">—</div>
    <div class="h-sub" id="hSub"></div>
  </div>
  <div class="h-clocks"><div><span>HERE</span><b id="clkA">--:--</b></div><div id="clkBWrap"><span id="clkBLbl">DEST</span><b id="clkB">--:--</b></div></div>
</header>

<!-- hover label -->
<div id="tip"><b id="tipT"></b><span id="tipS"></span></div>

<!-- hint row of places you can go -->
<nav id="dock">
  <button data-go="screen"><i class="d-ic ic-screen"></i><span>Screen</span></button>
  <button data-go="pocket"><i class="d-ic ic-pocket"></i><span>Passes</span></button>
  <button data-go="passport"><i class="d-ic ic-pp"></i><span>Passport</span></button>
  <button data-go="bin"><i class="d-ic ic-bin"></i><span>Bag</span></button>
  <button data-go="window"><i class="d-ic ic-win"></i><span>Window</span></button>
  <button data-go="call"><i class="d-ic ic-call"></i><span>Captain</span></button>
</nav>

<!-- the panel that opens beside whatever you're looking at -->
<aside id="panel" aria-hidden="true">
  <button id="pClose" class="p-close" title="Back to your seat (Esc)"><span></span></button>
  <div class="p-kicker" id="pKick"></div>
  <h2 class="p-title" id="pTitle"></h2>
  <div class="p-body" id="pBody"></div>
</aside>

<div id="ann"><div class="ann-k">FROM THE FLIGHT DECK</div><div class="ann-t" id="annT"></div></div>
<div id="toast"></div>
<div id="sheetWrap"><div id="sheet"></div></div>

<script type="module" src="cabin.js"></script>
</body>
</html>
